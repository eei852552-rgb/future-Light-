name: Build Future Light Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'js/**'
      - 'public/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact locked dependencies
        run: npm ci

      - name: Check existing web app source
        run: npm run check

      - name: Generate Android project only when missing, then sync Capacitor
        run: |
          npm run android:prepare
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Verify Android configuration
        run: |
          test -x android/gradlew
          grep -q 'applicationId "com.futurelight.editor"' android/app/build.gradle
          test -f android/app/src/main/assets/public/index.html

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload generated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: future-light-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
